var clsMap = {"一年级(1)班":1,"一年级(2)班":2,"一年级(3)班":3};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function doQuery(){
  var name = document.getElementById("nameInput").value.replace(/\s/g,"");
  var id = document.getElementById("idInput").value.replace(/\s/g,"");
  var err = document.getElementById("errMsg");
  var rc = document.getElementById("resultCard");
  err.style.display = "none";
  rc.classList.remove("show");
  if(!name || !id){err.textContent="请输入姓名和身份证号";err.style.display="block";return;}
  for(var i=0;i<STUDENTS.length;i++){
    var s = STUDENTS[i];
    var idMatch = (s[2] === id);
    if(s[0] === name && idMatch){
      var ci = clsMap[s[3]] || 1;
      var gn = s[1] === "男" ? "男生" : "女生";
      var rb = document.getElementById("resultBody");
      rb.innerHTML = 
        '<div class="result-row"><span class="result-label">学生姓名</span><span class="result-value">'+esc(s[0])+'</span></div>'+
        '<div class="result-row"><span class="result-label">性别</span><span class="result-value">'+gn+'</span></div>'+
        '<div class="result-row"><span class="result-label">班级</span><span class="result-value"><span class="cls-badge c'+ci+'">'+esc(s[3])+'</span></span></div>';
      rc.className = "result-card c"+ci+" show";
      return;
    }
  }
  err.textContent="查不到信息，请确认姓名和身份证号是否正确";
  err.style.display="block";
  rc.classList.remove("show");
}

document.getElementById("queryBtn").addEventListener("click", doQuery);
document.getElementById("nameInput").addEventListener("keydown", function(e){if(e.key==="Enter")document.getElementById("idInput").focus();});
document.getElementById("idInput").addEventListener("keydown", function(e){if(e.key==="Enter")doQuery();});
